name = "onewishes"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

routes = [
  { pattern = "onewishes.com", custom_domain = true },
  { pattern = "www.onewishes.com", custom_domain = true }
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
run_worker_first = false

[[r2_buckets]]
binding = "R2_BUCKET"
